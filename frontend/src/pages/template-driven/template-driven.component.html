<div class="container">
  <div class="row">
    <div class="col-6">
      <h1>Template friven form</h1>

          [(ngModel)]="user.name" required minlength="3" #name="ngModel">

          <small *ngIf="name.errors?.['required']">Name is required</small>

    <form #userForn="ngForm" (ngSubmit)="formSubmit(userForn)">
      <div>
        <label for="name">Name:</label>
        <input type="text" id="name" class="form-control my-2" name="name" placeholder="Enter your name"
          [(ngModel)]="user.name" required minlength="3" #name="ngModel">
          <div class="text-danger" *ngIf="name.invalid && name.touched">
          <small *ngIf="name.errors?.['required']">Name is required</small>
          <small *ngIf="name.errors?.['minlength']">Minimum 3 characters</small>
        </div>  
      
      </div>
      <div>
        <label for="email">Email:</label>
        <input type="email" id="email" class="form-control my-2" name="email" placeholder="Enter your email"
          [(ngModel)]="user.email" required email #email="ngModel">
        <!-- <div class="text-danger" *ngIf="email.invalid && email.touched">
          <small *ngIf="email.errors?.['required']">Email is required</small>
          <small *ngIf="email.errors?.['email']">Invalid email format</small>
        </div> -->
      </div>
      <input type="submit" class="btn btn-primary" value="Save">

    </form>
    </div>
    <div class="col-6">
      <h2>Login Form (Reactive)</h2>

      <form [formGroup]="reactiveForm" (ngSubmit)="onSubmit()">
        <div>
          <label>Email:</label>
          <input type="email" formControlName="email" class="form-control"/>
          <!-- <div class="text-danger" *ngIf="name.invalid && name.touched">
            <small *ngIf="?.['required']">Name is required</small>
            <small *ngIf="name.errors?.['minlength']">Minimum 3 characters</small>
          </div>   -->
              <div class="text-danger" *ngIf="reactiveForm.get('email')?.invalid && reactiveForm.get('email')?.touched">
            <small *ngIf="reactiveForm.get('email')?.errors?.['required']">Email is required</small>
            <small *ngIf="reactiveForm.get('email')?.errors?.['email']">Invalid email format</small>
          </div>
        </div>

        <div>
          <label>Password:</label>
          <input type="password" formControlName="password"  class="form-control"/>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <!-- Shows the live form values -->
      <!-- <p>Form Value: {{ reactiveForm.value | json }}</p> -->



    </div>
  </div>
</div>
