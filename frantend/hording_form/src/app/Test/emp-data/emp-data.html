<div class="card shadow-sm">
  <div class="card-header bg-success text-white">
    <h5 class="mb-0">Selected Employee(s)</h5>
  </div>
  <div class="card-body">
    <table class="table table-bordered table-striped text-center align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Department</th>
          <th>Salary</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let emp of evendata">
          <td>{{ emp.id }}</td>
          <td>{{ emp.name }}</td>
          <td>{{ emp.department }}</td>
          <td>{{ emp.salary}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<ng-template #noData>
  <p class="text-center text-muted mt-3">No employee selected yet.</p>
</ng-template>
