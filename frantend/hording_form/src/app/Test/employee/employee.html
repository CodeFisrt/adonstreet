<div class="container mt-4">
  <h2 class="text-center mb-4 text-primary">Employee Dashboard</h2>

  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Employee Data</h5>
    </div>
    <div class="card-body">
      <table class="table table-striped table-bordered table-hover text-center align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let emp of EmpData">
            <td>{{ emp.id }}</td>
            <td>{{ emp.name }}</td>
            <td>{{ emp.department }}</td>
            <td>{{ emp.salary | currency:'INR' }}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary" (click)="sendData(emp)">
                Send to Child
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ✅ Child component receives updated list -->
  <app-emp-data [evendata]="evenData"></app-emp-data>
</div>
