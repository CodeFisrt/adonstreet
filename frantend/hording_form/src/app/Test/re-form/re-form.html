<div class="container mt-5">
    <div class="row">
        <div class="col-6">
            <div class="form-card p-4 shadow-lg rounded-4">
                <h2 class="text-center text-primary mb-4">Employee Form</h2>

                <form [formGroup]="myForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Name</label>
                        <input type="text" class="form-control" formControlName="name"
                            placeholder="Enter employee name" />
                        <div class="text-danger" *ngIf="myForm.controls['name'].touched || myForm.controls['name'].dirty">
                            <span *ngIf="myForm.controls['name'].errors?.['required']">
                                Enter Name Plz
                            </span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Department</label>
                        <select class="form-select" formControlName="Deparment">
                            <option selected disabled>Select department</option>
                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Finance">Finance</option>
                        </select>
                         <div class="text-danger" *ngIf="myForm.controls['Deparment'].touched || myForm.controls['Deparment'].dirty">
                            <span *ngIf="myForm.controls['Deparment'].errors?.['required']">
                               choose Deparment Plz
                            </span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Salary</label>
                        <input type="number" class="form-control" formControlName="salary"
                            placeholder="Enter salary amount" />
                    </div>
                        <div class="text-danger" *ngIf="myForm.controls['salary'].touched || myForm.controls['salary'].dirty">
                                <span *ngIf="myForm.controls['salary'].errors?.['min']">
                                Salary must be above 30000
                                </span>
                            </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="submit" class="btn btn-primary px-4" (click)="submit()">Submit</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="col-6">
            <table class="table table-bordar">
                <thead>

                    <tr>
                        <th>name</th>
                        <th>Deparment</th>
                        <th>salary</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of userData">
                        <td>{{user.name}}</td>
                        <td>{{user.Deparment}}</td>
                        <td>{{user.salary}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
